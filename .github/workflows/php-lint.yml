name: PHP syntax check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
      - name: Lint all PHP files
        shell: bash
        run: |
          find . -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done
