<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#102a43"><title>إدارة السكن الجامعي</title>
<style>
:root{font-family:Tahoma,Arial,sans-serif;color:#172b4d;background:#f3f6fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 18px;background:#1261a0;color:white;font-weight:700}button.secondary{background:#e8eef6;color:#24415e}button.danger{background:#b42318}.shell{max-width:1120px;margin:auto;padding:28px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.brand{font-size:22px;font-weight:800}.muted{color:#718096}.panel{background:#fff;border:1px solid #e4eaf2;border-radius:18px;padding:22px;box-shadow:0 10px 28px #17324d0b}.login{max-width:430px;margin:9vh auto}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{width:100%;border:1px solid #d7e0eb;border-radius:10px;padding:12px;background:white}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:#102a43}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:18px 0}.stat{padding:18px;border-radius:14px;background:#f6f9fc;border:1px solid #e8eef5}.stat strong{display:block;font-size:28px;margin-top:8px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:right;padding:12px;border-bottom:1px solid #edf1f5;font-size:14px}th{color:#53677e;background:#f8fafc}.table-wrap{overflow:auto}.notice{padding:12px;border-radius:10px;margin:12px 0;background:#eef6ff;color:#174a75}.notice.error{background:#fff0ef;color:#9c2922}.hidden{display:none!important}.actions{display:flex;gap:8px;flex-wrap:wrap}.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.form-grid .field{margin:0}@media(max-width:600px){.shell{padding:18px 12px}.top{align-items:flex-start}.brand{font-size:18px}.panel{padding:16px}}
</style></head>
<body><main class="shell">
<section id="login" class="panel login"><div class="brand">🏠 إدارة السكن الجامعي</div><p class="muted">سجّل الدخول للوصول إلى بوابتك.</p><div class="field"><label>نوع الحساب</label><select id="role"><option value="student">طالب</option><option value="admin">مسؤول</option></select></div><div class="field"><label id="identity-label">البريد الإلكتروني</label><input id="identity" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><div id="message"></div><button id="login-btn" style="width:100%">تسجيل الدخول</button></section>
<section id="app" class="hidden"><header class="top"><div><div class="brand">🏠 إدارة السكن الجامعي</div><div class="muted" id="welcome"></div></div><button class="secondary" id="logout">تسجيل الخروج</button></header><nav class="tabs" id="tabs"></nav><div id="content" class="panel"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let current=null,section="overview";
async function api(path,options={}){const r=await fetch("/api"+path,{credentials:"same-origin",headers:{"Content-Type":"application/json",...(options.headers||{})},...options});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"تعذر تنفيذ الطلب");return d}
function notify(msg,error=false){$("message").innerHTML=msg?'<div class="notice '+(error?'error':'')+'">'+esc(msg)+'</div>':""}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("role").onchange=()=>{$("identity-label").textContent=$("role").value==="admin"?"اسم المستخدم أو البريد الإلكتروني":"البريد الإلكتروني";$("identity").type=$("role").value==="admin"?"text":"email"};
$("login-btn").onclick=async()=>{try{notify("");const d=await api("/auth/login",{method:"POST",body:JSON.stringify({identity:$("identity").value,password:$("password").value,role:$("role").value})});await enter(d.user)}catch(e){notify(e.message,true)}};
$("password").addEventListener("keydown",e=>{if(e.key==="Enter")$("login-btn").click()});
$("logout").onclick=async()=>{await api("/auth/logout",{method:"POST"});location.reload()};
async function enter(user){current=user;$("login").classList.add("hidden");$("app").classList.remove("hidden");$("welcome").textContent=user.role==="admin"?"لوحة المسؤول":"بوابة الطالب";const items=user.role==="admin"?[["overview","الرئيسية"],["rooms","الغرف"],["courses","المقررات"],["students","الطلاب"],["bookings","الحجوزات"],["password","تغيير كلمة المرور"]]:[["overview","ملفي"],["room","تفاصيل الغرفة"],["activity","سجل الدخول"]];$("tabs").innerHTML=items.map(([id,label])=>'<button class="'+(section===id?'active':'secondary')+'" data-id="'+id+'">'+label+'</button>').join("");$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{section=b.dataset.id;render()});section=user.role==="admin"?"overview":"overview";render()}
function table(headers,rows){return '<div class="table-wrap"><table><thead><tr>'+headers.map(x=>'<th>'+x+'</th>').join("")+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
async function render(){const c=$("content");$("tabs").querySelectorAll("button").forEach(b=>b.classList.toggle("active",b.dataset.id===section));try{
if(current.role==="student"){const d=section==="activity"?await api("/student/activity"):section==="room"?await api("/student/room"):await api("/student/dashboard");if(section==="activity"){c.innerHTML="<h2>سجل تسجيل الدخول</h2>"+table(["وقت الدخول","عنوان الاتصال"],(d.activity||[]).map(x=>"<tr><td>"+esc(new Date(x.loginTime).toLocaleString("ar"))+"</td><td>"+esc(x.ip||"غير متاح")+"</td></tr>").join(""))}
else{const s=d.student||{},b=section==="room"?d.room:d.booking;c.innerHTML='<h2>'+(section==="room"?"تفاصيل الغرفة":"مرحباً، "+esc([s.firstName,s.lastName].filter(Boolean).join(" ")))+'</h2><div class="grid">'+[['رقم التسجيل',s.regNo],['البريد الإلكتروني',s.email],['الغرفة',b?.roomno||"غير مخصصة"],['الرسوم الشهرية',b?.feespm??"—"],['عدد الأسرة',b?.seater??"—"],['بداية الإقامة',b?.stayfrom??"—"],['المدة بالأشهر',b?.duration??"—"],['البرنامج الدراسي',b?.course??"—"]].map(([k,v])=>'<div class="stat">'+k+'<strong>'+esc(v??"—")+'</strong></div>').join("")+'</div>'+(b?'<p class="muted">الوجبات: '+(b.foodstatus?"مشمولة":"غير مشمولة")+'</p>':'<p class="notice">لا يوجد حجز مرتبط بحسابك حالياً.</p>')}}
else if(section==="overview"){const d=await api("/admin/overview");c.innerHTML='<h2>نظرة عامة</h2><div class="grid">'+Object.entries({الطلاب:d.counts.students,الغرف:d.counts.rooms,المقررات:d.counts.courses,الحجوزات:d.counts.bookings}).map(([k,v])=>'<div class="stat">'+k+'<strong>'+v+'</strong></div>').join("")+'</div><h3>آخر تسجيلات الدخول</h3>'+table(["البريد","وقت الدخول"],d.recent.map(x=>'<tr><td>'+esc(x.userEmail)+'</td><td>'+esc(new Date(x.loginTime).toLocaleString("ar"))+'</td></tr>').join(""))}
else if(section==="rooms"){const d=await api("/admin/rooms");c.innerHTML='<h2>إدارة الغرف</h2><form id="add" class="form-grid"><div class="field"><label>رقم الغرفة</label><input name="room_no" type="number" required></div><div class="field"><label>عدد الأسرة</label><input name="seater" type="number" min="1" max="6" required></div><div class="field"><label>الرسوم الشهرية</label><input name="fees" type="number" min="0" required></div><div class="field"><label>&nbsp;</label><button>إضافة غرفة</button></div></form>'+table(["الغرفة","السعة","المشغول","الرسوم","إجراء"],d.rooms.map(x=>'<tr><td>'+x.room_no+'</td><td>'+x.seater+'</td><td>'+x.occupied+'</td><td>'+x.fees+'</td><td><button class="danger" data-del="'+x.id+'">حذف</button></td></tr>').join(""));$("add").onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));await api("/admin/rooms",{method:"POST",body:JSON.stringify(o)});render()};c.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("تأكيد حذف الغرفة؟")){await api("/admin/rooms/"+b.dataset.del,{method:"DELETE"});render()}})}
else if(section==="courses"){const d=await api("/admin/courses");c.innerHTML='<h2>إدارة المقررات</h2><form id="add" class="form-grid"><div class="field"><label>رمز المقرر</label><input name="course_code" required></div><div class="field"><label>اسم مختصر</label><input name="course_sn" required></div><div class="field"><label>اسم المقرر</label><input name="course_fn" required></div><div class="field"><label>&nbsp;</label><button>إضافة</button></div></form>'+table(["الرمز","الاسم المختصر","اسم المقرر","إجراء"],d.courses.map(x=>'<tr><td>'+esc(x.course_code)+'</td><td>'+esc(x.course_sn)+'</td><td>'+esc(x.course_fn)+'</td><td><button class="danger" data-del="'+x.id+'">حذف</button></td></tr>').join(""));$("add").onsubmit=async e=>{e.preventDefault();await api("/admin/courses",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});render()};c.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{if(confirm("تأكيد الحذف؟")){await api("/admin/courses/"+b.dataset.del,{method:"DELETE"});render()}})}
else if(section==="students"){const d=await api("/admin/students");c.innerHTML='<h2>الطلاب</h2>'+table(["رقم التسجيل","الاسم","البريد","الهاتف"],d.students.map(x=>'<tr><td>'+esc(x.regNo)+'</td><td>'+esc([x.firstName,x.middleName,x.lastName].filter(Boolean).join(" "))+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.contactNo)+'</td></tr>').join(""))}
else if(section==="bookings"){const d=await api("/admin/bookings");c.innerHTML='<h2>الحجوزات</h2>'+table(["الغرفة","رقم التسجيل","الطالب","البريد","بداية الإقامة","المدة"],d.bookings.map(x=>'<tr><td>'+x.roomno+'</td><td>'+esc(x.regno)+'</td><td>'+esc(x.firstName+" "+x.lastName)+'</td><td>'+esc(x.emailid)+'</td><td>'+esc(x.stayfrom)+'</td><td>'+x.duration+'</td></tr>').join(""))}
else if(section==="password"){c.innerHTML='<h2>تغيير كلمة المرور</h2><form id="pwd" class="form-grid"><div class="field"><label>كلمة المرور الحالية</label><input type="password" name="oldPassword" required></div><div class="field"><label>الجديدة</label><input type="password" name="newPassword" minlength="10" required></div><div class="field"><label>تأكيد الجديدة</label><input type="password" name="confirmPassword" minlength="10" required></div><div class="field"><label>&nbsp;</label><button>حفظ</button></div></form>';$("pwd").onsubmit=async e=>{e.preventDefault();await api("/admin/password",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});alert("تم تحديث كلمة المرور")}}
}catch(e){c.innerHTML='<div class="notice error">'+esc(e.message)+'</div>'}}
(async()=>{try{const d=await api("/auth/me");await enter(d.user)}catch{} })();
</script></body></html>
